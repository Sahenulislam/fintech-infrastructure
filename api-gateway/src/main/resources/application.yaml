server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: wallet-service
          uri: lb://wallet-service
          predicates:
            - Path=/api/wallet/**
          filters:
            - StripPrefix=0

        - id: transactional-service
          uri: lb://transactional-service
          predicates:
            - Path=/api/transactions/**
          filters:
            - StripPrefix=0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8012/eureka/

  instance:
    prefer-ip-address: true